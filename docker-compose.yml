# Local PostgreSQL for Milestone 1+.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: marginmind
      POSTGRES_PASSWORD: marginmind
      POSTGRES_DB: marginmind
    ports:
      - "5432:5432"
    volumes:
      - marginmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginmind -d marginmind"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  marginmind_pg:
